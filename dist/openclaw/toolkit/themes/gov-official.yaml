name: "gov-official"
description: "政务风：中国政府公文格式，仿宋/黑体/楷体字体，中国红双线页眉，适合信访件/倡议书/社区治理类内容"
colors:
  primary: "#C8102E"
  secondary: "#CC8800"
  text: "#1A1A1A"
  text_light: "#555555"
  background: "#FFFFFF"
  code_bg: "#F5F5F5"
  code_color: "#1A1A1A"
  quote_border: "#AAAAAA"
  quote_bg: "#F5F5F5"
  border_radius: "0px"
  darkmode:
    background: "#1A1A1A"
    text: "#E0DDD8"
    text_light: "#999999"
    primary: "#E84060"
    code_bg: "#282828"
    code_color: "#CCCCCC"
    quote_bg: "#242424"
    quote_border: "#666666"
base_css: |
  body {
    font-family: "仿宋", "FangSong", "STFangsong", Georgia, serif;
    font-size: 16px;
    line-height: 2;
    color: #1A1A1A;
    background: #FFFFFF;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-family: "黑体", "SimHei", "STHeiti", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #1A1A1A;
    margin: 0 0 16px 0;
    padding: 16px 0;
    border-top-width: 4px;
    border-top-style: solid;
    border-top-color: #C8102E;
    border-bottom-width: 2px;
    border-bottom-style: solid;
    border-bottom-color: #C8102E;
    text-align: center;
    line-height: 1.5;
  }

  h2 {
    font-family: "黑体", "SimHei", "STHeiti", sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #1A1A1A;
    margin: 28px 0 12px 0;
    padding-left: 12px;
    border-left-width: 4px;
    border-left-style: solid;
    border-left-color: #C8102E;
    line-height: 1.5;
  }

  h3 {
    font-family: "楷体", "KaiTi", "STKaiti", serif;
    font-size: 17px;
    font-weight: 600;
    color: #1A1A1A;
    margin: 20px 0 10px 0;
    line-height: 1.5;
  }

  h4 {
    font-size: 16px;
    font-weight: 600;
    color: #333333;
    margin: 16px 0 8px 0;
    line-height: 1.5;
  }

  p {
    font-size: 16px;
    line-height: 2;
    color: #1A1A1A;
    margin: 12px 0;
    text-indent: 2em;
  }

  strong {
    font-weight: 700;
    color: #1A1A1A;
    font-family: "黑体", "SimHei", "STHeiti", sans-serif;
  }

  em {
    font-style: normal;
    font-family: "楷体", "KaiTi", "STKaiti", serif;
    color: #333333;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #F5F5F5;
    color: #1A1A1A;
    padding: 2px 6px;
    border-radius: 0;
    border-width: 1px;
    border-style: solid;
    border-color: #DDDDDD;
  }

  pre {
    background: #F5F5F5;
    color: #1A1A1A;
    padding: 16px;
    border-radius: 0;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border-width: 1px;
    border-style: solid;
    border-color: #DDDDDD;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #1A1A1A;
    padding: 0;
    border: none;
    border-radius: 0;
  }

  blockquote {
    background: #F5F5F5;
    border-left-width: 4px;
    border-left-style: solid;
    border-left-color: #AAAAAA;
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 0;
    color: #333333;
  }

  blockquote p {
    margin: 6px 0;
    color: #333333;
    text-indent: 0;
    font-family: "仿宋", "FangSong", "STFangsong", serif;
    font-size: 15px;
    line-height: 1.9;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 16px;
    line-height: 2;
    color: #1A1A1A;
    margin: 4px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  thead {
    background: #1A1A1A;
  }

  th {
    background: #1A1A1A;
    color: #FFFFFF;
    font-weight: 600;
    font-family: "黑体", "SimHei", sans-serif;
    padding: 10px 14px;
    text-align: left;
    border-width: 1px;
    border-style: solid;
    border-color: #1A1A1A;
  }

  td {
    padding: 10px 14px;
    border-width: 1px;
    border-style: solid;
    border-color: #DDDDDD;
    color: #1A1A1A;
  }

  tr:nth-child(even) {
    background: #F5F5F5;
  }

  tr {
    background: #FFFFFF;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 20px auto;
    border-radius: 0;
  }

  a {
    color: #C8102E;
    text-decoration: none;
  }

  hr {
    border: none;
    border-top-width: 1px;
    border-top-style: solid;
    border-top-color: #DDDDDD;
    margin: 24px 0;
  }
